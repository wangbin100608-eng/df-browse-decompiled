[package]
name = "di_core"
version = "1.0.0"
edition = "2021"
description = "DeltaInventory core: instance tracking, dedup, valuation, 2D bin packing"

[lib]
name = "di_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
strip = true
